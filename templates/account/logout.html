{% extends "base.html" %}
{% load i18n %}

{% block title %}ออกจากระบบ | MCOT Equipment Service{% endblock %}

{% block content %}
<section class="min-h-[60vh] flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-lg rounded-2xl border border-gray-200 bg-white shadow-sm p-8 dark:bg-gray-900/60 dark:border-gray-700">
        <div class="mb-6 text-center">
            <div class="mx-auto mb-4 w-12 h-12 rounded-full bg-red-50 text-red-600 dark:bg-red-500/10 dark:text-red-400 flex items-center justify-center">
                <i class="fa-solid fa-right-from-bracket text-lg"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-gray-900 dark:text-gray-100">ยืนยันการออกจากระบบ</h1>
            <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">คุณแน่ใจหรือไม่ว่าต้องการออกจากระบบตอนนี้</p>
        </div>

        <form method="post" action="{% url 'account_logout' %}" class="space-y-3">
            {% csrf_token %}
            {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
            {% endif %}

            <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 transition-colors">
                <i class="fa-solid fa-right-from-bracket"></i>
                ออกจากระบบ
            </button>

            <a href="/" class="w-full inline-flex items-center justify-center gap-2 rounded-xl border border-gray-300 text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-200 dark:hover:bg-gray-800 py-3 px-4 font-semibold transition-colors">
                <i class="fa-solid fa-house"></i>
                กลับหน้าแรก
            </a>
        </form>
    </div>
</section>
{% endblock %}
