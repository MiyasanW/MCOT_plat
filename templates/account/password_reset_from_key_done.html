{% extends 'base.html' %}
{% load i18n %}

{% block title %}เปลี่ยนรหัสผ่านเรียบร้อย — MCOT Rental Platform{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-green-500 to-mcot-purple mb-4 shadow-lg shadow-green-500/20 border border-white/50">
                <i class="fas fa-check-circle text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900 font-display drop-shadow-sm">เปลี่ยนรหัสผ่าน</h1>
        </div>

        <div class="bg-white/60 backdrop-blur-xl shadow-2xl border border-white/60 rounded-3xl p-8 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-green-100/50 to-transparent rounded-bl-full pointer-events-none"></div>

            <p class="relative z-10 text-gray-700 text-center">
                รหัสผ่านของคุณถูกเปลี่ยนเรียบร้อยแล้ว
            </p>

            <div class="mt-8 text-center relative z-10">
                <a href="{% url 'account_login' %}" class="inline-block w-full bg-mcot-orange text-white font-bold py-3.5 rounded-xl hover:bg-orange-600 transition-all duration-200 shadow-lg shadow-orange-500/30">
                    <i class="fas fa-sign-in-alt mr-2"></i> เข้าสู่ระบบ
                </a>
            </div>
            <div class="mt-6 text-center text-sm text-gray-600 relative z-10">
                <a href="/" class="hover:text-mcot-orange transition-colors font-medium"><i class="fas fa-arrow-left text-xs mr-1"></i> กลับหน้าหลัก</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
