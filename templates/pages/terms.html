{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen pt-24 pb-20">
    <div class="container mx-auto px-4 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">ข้อกำหนดและเงื่อนไขการใช้งาน</h1>
            <p class="text-gray-400">Terms of Service</p>
        </div>

        <!-- Content Card -->
        <div class="glass-panel p-8 md:p-12 rounded-3xl border border-white/10 relative overflow-hidden">
            <!-- Background Glow -->
            <div class="absolute top-0 right-0 w-96 h-96 bg-mcot-orange/5 rounded-full blur-3xl -z-10 transform translate-x-1/2 -translate-y-1/2"></div>
            
            {% include 'pages/terms_partial.html' %}

            <!-- Footer Action -->
            <div class="mt-12 text-center flex justify-center gap-4">
                <button onclick="window.close()" class="hidden md:inline-flex items-center text-gray-400 hover:text-white transition-colors border border-white/10 px-6 py-2 rounded-full hover:bg-white/5">
                    <i class="fas fa-times mr-2"></i> ปิดหน้านี้
                </button>
                <a href="javascript:history.back()" class="inline-flex items-center text-gray-400 hover:text-white transition-colors border border-white/10 px-6 py-2 rounded-full hover:bg-white/5">
                    <i class="fas fa-arrow-left mr-2"></i> ย้อนกลับ
                </a>
            </div>
            <p class="text-center text-gray-600 text-xs mt-4">*หากเปิดในแท็บใหม่ กรุณาปิดแท็บเพื่อกลับสู่หน้าเดิม</p>
        </div>
    </div>
</div>
{% endblock %}
