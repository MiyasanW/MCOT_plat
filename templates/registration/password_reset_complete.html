{% extends 'base.html' %}

{% block title %}รีเซ็ตรหัสผ่านสำเร็จ — MCOT Rental Platform{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-green-500 to-emerald-600 mb-4 shadow-lg shadow-green-500/20">
                <i class="fas fa-check-double text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white font-display">รีเซ็ตรหัสผ่านสำเร็จ</h1>
            <p class="text-gray-400 text-sm mt-2">รหัสผ่านของคุณถูกเปลี่ยนเป็นรหัสผ่านใหม่เรียบร้อยแล้ว</p>
        </div>

        <!-- Action Card -->
        <div class="glass-panel p-8 shadow-2xl text-center">
            <p class="text-gray-300 mb-6 font-medium">ตอนนี้คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที</p>
            
            <a href="{% url 'login' %}"
                class="inline-block w-full bg-gradient-to-r from-mcot-orange to-orange-600 text-white font-semibold py-3 rounded-lg hover:from-orange-600 hover:to-mcot-orange transform hover:scale-[1.02] transition-all duration-200 shadow-lg shadow-mcot-orange/20">
                <i class="fas fa-sign-in-alt mr-2"></i> เข้าสู่ระบบ
            </a>
            
            <div class="mt-6 text-sm text-gray-500">
                <a href="{% url 'store:home' %}" class="hover:text-mcot-orange transition-colors">
                    <i class="fas fa-home mr-1"></i> กลับไปหน้าหลัก
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
