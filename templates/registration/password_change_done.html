{% extends 'base.html' %}

{% block title %}เปลี่ยนรหัสผ่านสำเร็จ — MCOT Rental Platform{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-green-500 to-emerald-600 mb-4 shadow-lg shadow-green-500/20">
                <i class="fas fa-check text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white font-display drop-shadow-sm transition-colors">เปลี่ยนรหัสผ่านสำเร็จ</h1>
            <p class="text-gray-600 dark:text-gray-300 text-sm mt-2 font-medium transition-colors">รหัสผ่านของคุณถูกเปลี่ยนเรียบร้อยแล้ว</p>
        </div>

        <!-- Action Card -->
        <div class="bg-white/60 dark:bg-slate-800/70 backdrop-blur-xl border border-white/60 dark:border-slate-700/70 rounded-3xl p-8 shadow-2xl relative overflow-hidden text-center transition-colors">
            <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-green-100/50 dark:from-green-900/20 to-transparent rounded-bl-full pointer-events-none"></div>
            
            <p class="text-gray-700 dark:text-gray-200 mb-6 font-medium relative z-10 transition-colors">คุณสามารถใช้รหัสผ่านใหม่ในการเข้าสู่ระบบครั้งถัดไป</p>
            
            <a href="{% url 'store:my_bookings' %}"
                class="inline-block w-full bg-mcot-orange text-white font-bold py-3.5 rounded-xl hover:bg-orange-600 transform hover:-translate-y-0.5 transition-all duration-200 shadow-lg shadow-orange-500/30 relative z-10">
                <i class="fas fa-arrow-right mr-2"></i> กลับไปหน้าการจองของฉัน
            </a>
            
            <div class="mt-8 text-sm text-gray-600 dark:text-gray-300 relative z-10 transition-colors">
                <a href="{% url 'store:home' %}" class="hover:text-mcot-orange transition-colors">
                    <i class="fas fa-home mr-1"></i> กลับไปหน้าหลัก
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
