{% extends 'base.html' %}

{% block title %}ออกจากระบบแล้ว — MCOT Rental Platform{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md text-center">
        <!-- Icon -->
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-green-500/10 border border-green-500/20 mb-6">
            <i class="fas fa-check-circle text-green-400 text-4xl"></i>
        </div>

        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-3 transition-colors">ออกจากระบบแล้ว</h1>
        <p class="text-gray-600 dark:text-gray-300 mb-8 transition-colors">คุณได้ออกจากระบบเรียบร้อยแล้ว ขอบคุณที่ใช้บริการ</p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="{% url 'login' %}"
                class="inline-flex items-center justify-center bg-gradient-to-r from-mcot-orange to-orange-600 text-white font-semibold px-6 py-3 rounded-lg hover:from-orange-600 hover:to-mcot-orange transition-all shadow-lg shadow-mcot-orange/20">
                <i class="fas fa-sign-in-alt mr-2"></i> เข้าสู่ระบบอีกครั้ง
            </a>
            <a href="/"
                class="inline-flex items-center justify-center bg-white/60 dark:bg-slate-800/70 backdrop-blur-xl border border-white/60 dark:border-slate-700/70 text-gray-700 dark:text-gray-100 font-semibold px-6 py-3 rounded-lg hover:bg-white/80 dark:hover:bg-slate-700/70 transition-all">
                <i class="fas fa-home mr-2"></i> กลับหน้าหลัก
            </a>
        </div>
    </div>
</div>
{% endblock %}
