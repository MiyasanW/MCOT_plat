{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-black/90">
    <div class="bg-white/10 backdrop-blur-md p-8 rounded-xl shadow-2xl border border-white/20 w-full max-w-md">
        <h2 class="text-3xl font-bold text-white mb-6 text-center">Log In</h2>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            {% if form.errors %}
            <div class="bg-red-500/20 border border-red-500 text-red-100 px-4 py-3 rounded">
                <p class="font-bold">Error:</p>
                {{ form.non_field_errors }}
                {% for field in form %}
                {% for error in field.errors %}
                <p>{{ field.label }}: {{ error }}</p>
                {% endfor %}
                {% endfor %}
            </div>
            {% endif %}

            <div>
                <label class="block text-gray-300 text-sm font-bold mb-2">Username</label>
                <input type="text" name="username"
                    class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-mcot-gold focus:border-transparent outline-none transition-all"
                    required autofocus>
            </div>

            <div>
                <label class="block text-gray-300 text-sm font-bold mb-2">Password</label>
                <input type="password" name="password"
                    class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-mcot-gold focus:border-transparent outline-none transition-all"
                    required>
            </div>

            <button type="submit"
                class="w-full bg-mcot-gold text-black font-bold py-3 rounded-lg hover:bg-yellow-400 transform hover:scale-[1.02] transition-all duration-200">
                Sign In
            </button>

            <input type="hidden" name="next" value="{{ next }}" />
        </form>
    </div>
</div>
{% endblock %}
