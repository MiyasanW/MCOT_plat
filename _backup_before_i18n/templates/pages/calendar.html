{% extends 'base.html' %} 

{% block title %}ปฏิทินการจอง - MCOT Rental{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div>
            <h1 class="text-3xl font-bold text-white mb-2" style="text-shadow: 0 0 20px rgba(242, 101, 34, 0.5);">
                🗓 ปฏิทินการจอง
            </h1>
            <p class="text-gray-400">ภาพรวมการจองสตูดิโอและอุปกรณ์</p>
        </div>
        
        <div class="flex items-center space-x-2">
            <!-- Staff Filter -->
            <select id="staff-filter" class="hidden md:block text-sm bg-[#181B21] text-gray-300 border border-[#2A2F38] rounded-lg px-3 py-2 outline-none focus:border-[#F26522] focus:ring-1 focus:ring-[#F26522] transition-colors mr-2 cursor-pointer font-medium">
                <option value="all">👥 ดูงานทั้งหมด (All)</option>
                <option value="me">👤 งานของฉัน (My Jobs)</option>
                <option disabled>──────────</option>
            </select>

            <div class="flex items-center space-x-2 text-sm text-gray-400 bg-[#181B21] px-4 py-2 rounded-lg border border-[#2A2F38]">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                <span>Approved</span>
                <span class="w-2 h-2 rounded-full bg-green-500 ml-2"></span>
                <span>Active</span>
                <span class="w-2 h-2 rounded-full bg-yellow-500 ml-2"></span>
                <span>Pending</span>
            </div>
            <!-- Future: Staff Filter Dropdown -->
        </div>
    </div>

    <!-- Calendar Container -->
    <div class="bg-[#181B21] border border-[#2A2F38] p-4 md:p-6 rounded-2xl shadow-lg relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute top-0 right-0 w-64 h-64 bg-[#F26522] opacity-5 rounded-full blur-3xl -mr-32 -mt-32 pointer-events-none"></div>

        <div id="calendar" class="relative z-10"></div>
    </div>
</div>

<!-- FullCalendar Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales/th.global.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            locale: 'th',
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,listMonth'
            },
            navLinks: true, // can click day/week names to navigate views
            businessHours: true, // display business hours
            editable: false,
            selectable: true,
            dayMaxEvents: true, // allow "more" link when too many events
            
            // Dynamic Events Source with Filter
            events: {
                url: '/api/calendar/events/',
                extraParams: function() {
                    const filterEl = document.getElementById('staff-filter');
                    return {
                        staff_id: filterEl ? filterEl.value : 'all'
                    };
                }
            },
            
            eventClick: function(info) {
                // Open admin change page in new tab
                if (info.event.url) {
                    window.open(info.event.url, "_blank");
                    info.jsEvent.preventDefault();
                }
            },
            
            eventDidMount: function(info) {
                // Tooltip logic could go here
                info.el.title = info.event.extendedProps.customer + " (" + info.event.extendedProps.status + ")";
            }
        });
        calendar.render();

        // --- Logic: Fetch Staff List & Handle Filter ---
        
        // 1. Fetch Staff List
        fetch('/api/calendar/staff/')
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById('staff-filter');
                if (!select) return;
                
                data.forEach(staff => {
                    const option = document.createElement('option');
                    option.value = staff.id;
                    option.textContent = `For: ${staff.name}`;
                    select.appendChild(option);
                });
            })
            .catch(error => console.error('Error fetching staff:', error));

        // 2. Filter Change Event
        const filterEl = document.getElementById('staff-filter');
        if (filterEl) {
            filterEl.addEventListener('change', function() {
                calendar.refetchEvents(); // Reload events with new staff_id
            });
        }
    });
</script>

<style>
    /* Custom FullCalendar overrides for Dark Theme */
    :root {
        --fc-border-color: #2A2F38;
        --fc-button-bg-color: #F26522;
        --fc-button-border-color: #F26522;
        --fc-button-hover-bg-color: #fb7830;
        --fc-button-hover-border-color: #fb7830;
        --fc-button-active-bg-color: #d65012;
        --fc-button-active-border-color: #d65012;
        
        --fc-page-bg-color: transparent;
        --fc-neutral-bg-color: #181B21;
        --fc-neutral-text-color: #FFFFFF;
        --fc-list-event-hover-bg-color: rgba(255, 255, 255, 0.05);
        --fc-today-bg-color: rgba(242, 101, 34, 0.05);
    }

    .fc {
        font-family: 'Outfit', 'Sarabun', sans-serif;
        color: #e5e7eb;
    }
    
    .fc-theme-standard td, .fc-theme-standard th {
        border-color: var(--fc-border-color);
    }
    
    .fc-col-header-cell-cushion {
        color: #9CA3AF; /* text-muted */
        text-decoration: none !important;
        font-weight: 500;
        padding-top: 8px;
        padding-bottom: 8px;
    }
    
    .fc-daygrid-day-number {
        color: #e5e7eb;
        text-decoration: none !important;
        padding: 8px;
    }
    
    /* Buttons */
    .fc-button {
        border-radius: 8px !important;
        text-transform: capitalize !important;
        font-weight: 500 !important;
        border: none !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        padding: 8px 16px !important;
    }
    
    .fc-button-primary {
        background-color: var(--fc-button-bg-color) !important;
    }
    
    .fc-toolbar-title {
        color: white;
        font-size: 1.5rem !important;
        font-weight: 700;
    }
    
    /* Events */
    .fc-event {
        border: none !important;
        border-radius: 4px;
        padding: 2px 4px;
        font-size: 0.85em;
        cursor: pointer;
        transition: transform 0.2s;
    }
    
    .fc-event:hover {
        transform: scale(1.02);
        opacity: 0.9;
    }
    
    /* List View */
    .fc-list {
        border-color: var(--fc-border-color);
    }
    .fc-list-event:hover td {
        background-color: var(--fc-list-event-hover-bg-color);
    }
    .fc-list-day-cushion {
        background-color: #2A2F38 !important;
    }
</style>
{% endblock %}
